name: Terminale Transversal gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terminale-transversal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check assets/terminale-transversal.js
          node --check assets/terminale-transversal-ui.js
          node --check assets/capstone-bank.js
          node --check scripts/validate-terminale-transversal.mjs
      - name: Transversal model and Bac 2027
        run: node scripts/validate-terminale-transversal.mjs
      - name: All exercise solutions
        run: node scripts/validate-exercises.mjs
      - name: Offline wiring
        run: |
          grep -q 'terminale-transversal-ui.js?v=1.24.0' index.html
          grep -q 'terminale-transversal.js' sw.js
          grep -q 'terminale-transversal-ui.js?v=1.24.0' sw.js
