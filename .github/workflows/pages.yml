name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build classroom-ready static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          cp -R assets _site/assets
          bash scripts/fetch-pyodide.sh "_site/vendor/pyodide/314.0.7"
          test -s _site/vendor/pyodide/314.0.7/pyodide.asm.wasm
          test -s _site/vendor/pyodide/314.0.7/python_stdlib.zip
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
