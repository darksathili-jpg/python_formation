name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check assets/app.js
          node --check assets/app-shell.js
          node --check assets/content.js
          node --check assets/content-meta.js
          node --check assets/content-p1.js
          node --check assets/content-p2.js
          node --check assets/content-t1.js
          node --check assets/content-t2.js
          node --check assets/practice-bank.js
          node --check assets/primm-bank.js
          node --check assets/capstone-bank.js
          node --check assets/pedagogy-bootstrap.js
          node --check assets/pedagogy-engine.js
          node --check assets/novice-bank.js
          node --check assets/novice-overrides.js
          node --check assets/student-zero-p1p2.js
          node --check assets/student-zero-p3p4.js
          node --check assets/student-zero-p5p6.js
          node --check assets/novice-gate.js
          node --check assets/exercise-brief.js
          node --check assets/statement-enhancer.js
          node --check assets/runtime-config.js
          node --check assets/python-worker.js
          node --check scripts/validate-exercises.mjs
          node --check scripts/validate-novice.mjs
          node --check scripts/validate-student-zero.mjs
          node --check scripts/validate-student-zero-p3p4.mjs
          node --check scripts/validate-student-zero-p5p6.mjs
          node --check scripts/validate-contrast.mjs
          node --check scripts/validate-statements.mjs
          node --check sw.js
          bash -n scripts/fetch-pyodide.sh
      - name: Content integrity
        run: |
          node --input-type=module <<'NODE'
          import { modules, practiceBank, primmBank, capstones, noviceBank } from './assets/content.js';
          const ids = modules.map(m => m.id);
          const coreIds = modules.flatMap(m => m.exercises.map(e => e.id));
          const expected = { premiere: 9, terminale: 11 };
          for (const [track, count] of Object.entries(expected)) {
            const got = modules.filter(m => m.track === track).length;
            if (got !== count) throw new Error(`${track}: ${got} modules au lieu de ${count}`);
          }
          if (new Set(ids).size !== ids.length) throw new Error('Identifiants de modules dupliqués');
          if (new Set(coreIds).size !== coreIds.length) throw new Error('Identifiants d’exercices cœur dupliqués');
          if (modules.some(m => m.exercises.length < 3)) throw new Error('Chaque module doit contenir au moins 3 exercices cœur');
          if (practiceBank.length !== 100) throw new Error(`Banque: ${practiceBank.length} au lieu de 100`);
          if (primmBank.length !== 20) throw new Error(`PRIMM: ${primmBank.length} au lieu de 20`);
          if (capstones.length !== 4) throw new Error(`Applications: ${capstones.length} au lieu de 4`);
          if (noviceBank.length !== 20) throw new Error(`Passerelles novice: ${noviceBank.length} au lieu de 20`);
          console.log(`${modules.length} modules, ${coreIds.length} cœur + ${practiceBank.length} entraînements + ${capstones.length} applications + ${noviceBank.length} passerelles : structure OK`);
          NODE
      - name: Pedagogy engine gate
        run: |
          node scripts/validate-exercises.mjs
          grep -q 'NSI accessible sans spécialité mathématiques' assets/pedagogy-engine.js
          grep -q 'Tremplin Parsons' assets/pedagogy-engine.js
          grep -q 'Atelier PRIMM' assets/pedagogy-engine.js
          grep -q 'Réactivation espacée' assets/pedagogy-engine.js
          grep -q 'session 2027' assets/pedagogy-engine.js
          grep -q 'capstoneEnhancementHash' assets/pedagogy-bootstrap.js
      - name: Novice learning gate
        run: |
          node scripts/validate-novice.mjs
          grep -q 'Avant de coder : construire le bon modèle mental' assets/novice-gate.js
          grep -q 'Coach de débogage' assets/novice-gate.js
          grep -q 'def.*return' assets/novice-bank.js
          grep -q 'novice-gate.js' index.html
          grep -q 'novice-bank.js' sw.js
      - name: Student Zero P1/P2 gate
        run: |
          node scripts/validate-student-zero.mjs
          test -s assets/student-zero-p1p2.js
          grep -q 'applyStudentZeroP1P2' assets/content.js
          grep -q 'student-zero-p1p2.js' sw.js
          grep -q 'Pourquoi vois-tu déjà def et return' assets/student-zero-p1p2.js
          grep -q 'Méthode anti-erreur pour les frontières' assets/student-zero-p1p2.js
      - name: Student Zero P3/P4 gate
        run: |
          node scripts/validate-student-zero-p3p4.mjs
          test -s assets/student-zero-p3p4.js
          grep -q 'applyStudentZeroP3P4' assets/content.js
          grep -q 'student-zero-p3p4.js' sw.js
          grep -q 'Dans P3, le cadre def / return reste fourni' assets/student-zero-p3p4.js
          grep -q 'Méthode P4 : contrat → signature → corps → tests' assets/student-zero-p3p4.js
      - name: Student Zero P5/P6 gate
        run: |
          node scripts/validate-student-zero-p5p6.mjs
          test -s assets/student-zero-p5p6.js
          grep -q 'applyStudentZeroP5P6' assets/content.js
          grep -q 'student-zero-p5p6.js' sw.js
          grep -q 'Une chaîne se lit par indice, mais ne se modifie pas par indice' assets/student-zero-p5p6.js
          grep -q 'Transition P5 → P6' assets/student-zero-p5p6.js
          grep -q 'Alias : deux noms peuvent désigner la même liste' assets/student-zero-p5p6.js
      - name: Editorial statement gate
        run: |
          node scripts/validate-statements.mjs
          test -s assets/exercise-brief.js
          test -s assets/exercise-brief.css
          test -s assets/statement-enhancer.js
          grep -q 'Ce que tu dois réellement faire' assets/exercise-brief.js
          grep -q 'Valeur ou effet attendu' assets/exercise-brief.js
          grep -q 'Erreur classique à éviter' assets/exercise-brief.js
          grep -q 'Exemples contrôlés' assets/exercise-brief.js
          grep -q 'statement-enhancer.js?v=1.10.0' index.html
          grep -q 'exercise-brief.css?v=1.10.0' index.html
          grep -q 'statement-enhancer.js?v=1.10.0' sw.js
          ! grep -q 'Le résultat renvoyé ou affiché doit respecter exactement la règle décrite' assets/exercise-brief.js
      - name: Visual contrast gate
        run: |
          node scripts/validate-contrast.mjs
          test -s assets/visual-contrast.css
          grep -q 'visual-contrast.css?v=1.10.0' index.html
          grep -q 'visual-contrast.css?v=1.10.0' sw.js
          grep -q 'projector mode is a dedicated high-luminance palette' assets/visual-contrast.css
      - name: Classroom reliability invariants
        run: |
          test -s scripts/fetch-pyodide.sh
          test -s assets/runtime-config.js
          test -s assets/classroom-reliability.css
          grep -q "PYODIDE_VERSION = '314.0.7'" assets/runtime-config.js
          grep -q '2abdcc2e35208af406e07724cffa85bc582ced97e9028383ecf5462541393f95' scripts/fetch-pyodide.sh
          grep -q "vendor/pyodide" assets/runtime-config.js
          grep -q 'runtimeURL' assets/python-worker.js
          ! grep -q 'cdn.jsdelivr.net/pyodide' assets/python-worker.js
          grep -q 'python-forge-pyodide-' sw.js
          grep -q "const PYODIDE_VERSION = '314.0.7'" sw.js
          grep -q 'lab-stdin' assets/app.js
      - name: Verify pinned Pyodide build asset
        run: |
          bash scripts/fetch-pyodide.sh /tmp/python-forge-pyodide
          test -s /tmp/python-forge-pyodide/pyodide.mjs
          test -s /tmp/python-forge-pyodide/pyodide.asm.mjs
          test -s /tmp/python-forge-pyodide/pyodide.asm.wasm
          test -s /tmp/python-forge-pyodide/python_stdlib.zip
          test -s /tmp/python-forge-pyodide/pyodide-lock.json
      - name: Required static files
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/pedagogy.css
          test -s assets/pedagogy-bootstrap.js
          test -s assets/novice-gate.css
          test -s assets/novice-gate.js
          test -s assets/novice-bank.js
          test -s assets/novice-overrides.js
          test -s assets/student-zero-p1p2.js
          test -s assets/student-zero-p3p4.js
          test -s assets/student-zero-p5p6.js
          test -s assets/branding.css
          test -s assets/branding/logo-watteau.jpg
          test -s assets/visual-contrast.css
          test -s assets/exercise-brief.css
          test -s assets/exercise-brief.js
          test -s assets/statement-enhancer.js
          test -s manifest.webmanifest
          grep -q 'id="view"' index.html
          grep -q 'id="python-engine-status"' index.html
          grep -q 'pedagogy-bootstrap.js' index.html
          grep -q 'pedagogy-engine.js' index.html
          grep -q 'novice-gate.js' index.html
          grep -q 'statement-enhancer.js' index.html
          grep -q 'logo-watteau.jpg' index.html
          grep -q 'branding.css' index.html
          grep -q 'visual-contrast.css' index.html
          grep -q 'exercise-brief.css' index.html
          grep -q 'pedagogy-bootstrap.js' sw.js
          grep -q 'practice-bank.js' sw.js
          grep -q 'novice-gate.js' sw.js
          grep -q 'statement-enhancer.js' sw.js
          grep -q 'exercise-brief.js' sw.js
          grep -q 'student-zero-p1p2.js' sw.js
          grep -q 'student-zero-p3p4.js' sw.js
          grep -q 'student-zero-p5p6.js' sw.js
          grep -q 'logo-watteau.jpg' sw.js
          grep -q 'visual-contrast.css' sw.js
          grep -q 'prefers-reduced-motion' assets/styles.css
          grep -q 'prefers-reduced-motion' assets/classroom-reliability.css
          grep -q 'prefers-reduced-motion' assets/pedagogy.css
          grep -q 'prefers-reduced-motion' assets/novice-gate.css
          grep -q 'prefers-reduced-motion' assets/branding.css
